<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniActivity Hub - Đăng nhập</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            
            <div class="login-header">
                <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                <h2>Câu lạc bộ</h2>
                <p>Hệ thống Quản lý CLB & ĐRL Sinh viên</p>
            </div>

            <form class="login-form">
                <div class="input-group">
                    <label for="username">Mã số sinh viên / Tài khoản quản trị</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="username" placeholder="Nhập mã số sinh viên hoặc tài khoản..." required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="password">Mật khẩu</label>
                        <a href="#" class="forgot-password">Quên mật khẩu?</a>
                    </div>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Nhập mật khẩu của bạn..." required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Ghi nhớ đăng nhập
                    </label>
                </div>

                <button type="submit" class="btn-submit">Đăng Nhập</button>
            </form>

        </div>
        
        <div class="login-footer">
            Hệ thống Thông tin Quản lý Tập trung Các Hoạt động Ngoại khóa & Câu lạc bộ Sinh viên © 2026
        </div>
    </div>

</body>
</html>
